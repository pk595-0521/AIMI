services:
  - type: web
    name: aimi-superday
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
           - key: DATABASE_URL
             sync: false
           - key: SUPABASE_DATABASE_URL
             sync: false
           - key: NEXT_PUBLIC_SUPABASE_URL
             sync: false
           - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
             sync: false
           - key: SUPABASE_SERVICE_ROLE_KEY
             sync: false
           - key: LLM_API_KEY
             sync: false
           - key: APP_ORIGIN
             sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: AI_CONTRACT_REFERENCE
        sync: false
      - key: AI_ZERO_TRAINING_VERIFIED
        value: "false"
